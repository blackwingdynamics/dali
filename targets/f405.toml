[profile]
name = "f405"
backend = "stm32f405"
board = "WeAct Studio STM32F405RGT6 Core Board"
mcu = "STM32F405RGT6"
rust_target = "thumbv7em-none-eabihf"
probe_chip = "STM32F405RG"
application_supported = true
amrn_target_id = 0x02
abi_version = 3

[capabilities]
storage = true
usb_console = true
mpu = true
relocation = true

[artifacts]
kernel_binary = "dali-f405-f405.bin"
kernel_elf = "dali-f405"

[profile.dfu]
vendor_id = 0x0483
product_id = 0xDF11
address = 0x0800_0000
alternate = 0
leave = true

[clock]
source = "HSE"
input_hz = 8_000_000
system_hz = 168_000_000
pclk1_hz = 42_000_000
pclk2_hz = 84_000_000
usb_hz = 48_000_000

[i2c]
bus_frequency_hz = 100_000

[display]
controller = "SSD1306"
i2c_address = 0x3C
width = 128
height = 64
text_cell_width = 8
text_cell_height = 8
timeout_ticks = 100

[driver_probe]
uart_baud_rate_hz = 115_200
spi_clock_hz = 1_000_000
timeout_ticks = 100
polls_per_timeout_tick = 1
timer_timeout_divisor = 10
timer_evidence_poll_limit = 0x00ff_ffff
buffer_length = 1
spi_fill_byte = 0xff
spi_device_id = 0
i2c_address = 0x42

[user_key]
port = 'C'
pin = 13

[scheduler]
quantum_ticks = 1
tick_hz = 1000

[watchdog]
controller = "IWDG"
timeout_ms = 2000
feed_interval_ms = 500
reset_cause_supported = true

[authentication]
development = "unsigned"
release = "ed25519"
development_trust_anchors = [
  { key_id = "07070707070707070707070707070707", public_key = "D75A980182B10AB7D54BFED3C964073A0EE172F3DAA62325AF021A68F707511A" },
]
release_trust_anchors = [
  { key_id = "7A26ED9D6833827833CC8B8BC8D56B27", public_key = "08BEEFE9233B28C17E372874D0204CB0A423E3A04D1803A6252F388E5D183EC7" },
]

[memory]
flash = { origin = 0x0800_0000, length = 524_288 }
firmware = { origin = 0x0800_0000, length = 393_216 }
artifact = { origin = 0x0806_0000, length = 131_072 }
artifact_capacity = 65_536
kernel_origin = 0x2000_0000
kernel_length = 32_768
application_origin = 0x2000_8000
application_length = 65_536
runtime_origin = 0x2001_8000
runtime_length = 32_768
dma = { origin = 0x2000_0000, length = 32_768 }
ccm = { origin = 0x1000_0000, length = 65_536 }

[memory.isolation]
peripheral_origin = 0x4000_0000
peripheral_length = 536_870_912
# RM0090 Table 3: 1 MiB flash ends at 0x000F_FFFF; the next code-region
# address is reserved and is used only by the BusFault decoder fixture.
bus_fault_origin = 0x0010_0000
bus_fault_length = 32

[[memory.isolation.slots]]
id = 0
name = "slot0"
code_origin = 0x2000_8000
code_length = 16_384
data_origin = 0x2000_C000
data_length = 16_384
stack_length = 4_096

[[memory.isolation.slots]]
id = 1
name = "slot1"
code_origin = 0x2001_0000
code_length = 16_384
data_origin = 0x2001_4000
data_length = 16_384
stack_length = 4_096

[status_led]
port = "PB"
number = 2
alternate_function = 0
active_high = true

[usb]
controller = "OTG_FS"
dm = { port = "PA", number = 11, alternate_function = 10, active_high = false }
dp = { port = "PA", number = 12, alternate_function = 10, active_high = false }

[storage]
controller = "SDIO"
bus_width = 4
data_timeout_cycles = 1_000_000
command_poll_limit = 1_000_000
ocr_poll_limit = 1_000
data_poll_limit = 1_000_000
dma_stop_poll_limit = 1_000_000
clock = { port = "PC", number = 12, alternate_function = 12, active_high = false }
command = { port = "PD", number = 2, alternate_function = 12, active_high = false }
data = [
    { port = "PC", number = 8, alternate_function = 12, active_high = false },
    { port = "PC", number = 9, alternate_function = 12, active_high = false },
    { port = "PC", number = 10, alternate_function = 12, active_high = false },
    { port = "PC", number = 11, alternate_function = 12, active_high = false },
]
