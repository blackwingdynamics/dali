[profile]
name = "f411"
backend = "stm32f411"
board = "WeAct BlackPill"
mcu = "STM32F411CEU6"
rust_target = "thumbv7em-none-eabihf"
application_supported = false
amrn_target_id = 0
abi_version = 0

[authentication]
development = "unsigned"
release = "ed25519"
development_trust_anchors = []
release_trust_anchors = []

[capabilities]
storage = false
usb_console = false
mpu = false
relocation = false

[clock]
source = "HSI"
input_hz = 16_000_000
system_hz = 100_000_000
pclk1_hz = 50_000_000
pclk2_hz = 100_000_000
usb_hz = 48_000_000

[i2c]
bus_frequency_hz = 100_000

[driver_probe]
uart_baud_rate_hz = 115_200
spi_clock_hz = 1_000_000
timeout_ticks = 100
polls_per_timeout_tick = 1
timer_timeout_divisor = 10
timer_evidence_poll_limit = 0x00ff_ffff
buffer_length = 1
spi_fill_byte = 0xff
spi_device_id = 0
i2c_address = 0x42

[user_key]
port = 'C'
pin = 13

[memory]
flash = { origin = 0x0800_0000, length = 524_288 }
kernel_origin = 0x2000_0000
kernel_length = 32_768
application_origin = 0x2000_8000
application_length = 65_536
runtime_origin = 0x2001_8000
runtime_length = 32_768
dma = { origin = 0x2000_0000, length = 32_768 }

[status_led]
port = "PC"
number = 13
alternate_function = 0
active_high = false

[usb]
controller = "OTG_FS"
dm = { port = "PA", number = 11, alternate_function = 10, active_high = false }
dp = { port = "PA", number = 12, alternate_function = 10, active_high = false }
