[package]
name = "dali-kernel"
version = "0.1.0-alpha.2"
edition = "2024"
publish = false
autobins = false

[features]
default = []
sdio = []
log-colors = []
usb-cdc = [
    "dep:usb-device",
    "dep:usbd-serial",
    "dali-kernel-api/usb-cdc",
]
abi-current = []
abi-mpu = ["abi-current"]
abi-context-switch = ["abi-mpu", "dali-kernel-api/abi-context-switch"]
abi-relocation = ["abi-mpu"]
abi-test-fixtures = ["abi-mpu"]
dma-test-fixture = ["abi-relocation"]
abi-authentication = ["abi-relocation", "dep:dali-crypto"]
repository-loader = ["abi-authentication", "dep:dali-metadata"]
storage-write = ["dali-kernel-api/storage-write"]
storage-interruption-test = ["storage-write"]
storage-rollback-test = ["storage-write"]
watchdog-feed-failure-test = []
driver-hardware-test = ["dali-kernel-api/driver-hardware-test"]
display-oled = []

[lints]
workspace = true

[dependencies]
dali-amrn = { path = "../crates/dali-amrn" }
dali-crypto = { path = "../crates/dali-crypto", optional = true }
dali-metadata = { path = "../crates/dali-metadata", optional = true }
dali_sdk = { package = "dali", path = "../crates/dali-sdk" }
dali-driver-api = { path = "../crates/dali-driver-api" }
dali-usb = { path = "../crates/dali-usb" }
dali-targets = { path = "../crates/dali-targets" }
dali-kernel-api = { path = "../crates/dali-kernel-api" }
critical-section = "1.2"
embedded-sdmmc = { version = "=0.10.0", default-features = false }
fugit = "=0.3.9"
panic-halt = "1.0"
rtt-target = "0.6"
usb-device = { version = "=0.3.2", optional = true }
usbd-serial = { version = "=0.2.2", optional = true }

[build-dependencies]
dali-targets = { path = "../crates/dali-targets" }

[lib]
name = "dali_kernel_core"
path = "src/lib.rs"
