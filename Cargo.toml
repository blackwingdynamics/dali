[workspace]
members = [
    "kernel",
    "apps/dali-app-hello",
    "crates/dali-usb",
    "crates/dali-amrn",
    "crates/dali-metadata",
    "crates/dali-crypto",
    "crates/dali-device",
    "crates/dali-driver-api",
    "crates/dali-sdk",
    "crates/dali-cli",
    "crates/dali-targets",
    "crates/dali-boards",
    "crates/dali-kernel-api",
    "crates/dali-boards/dali-board-stm32f405",
    "crates/dali-firmware",
]
resolver = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
