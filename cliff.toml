[changelog]
header = """
# Dali OS Changelog

This changelog is generated from Conventional Commits.
"""
body = """
{% if version %}## [{{ version }}]{% else %}## [Unreleased]{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}- {{ commit.message | upper_first }}{% if commit.breaking %} **(BREAKING)**{% endif %}
{% endfor %}
{% endfor %}
"""
footer = """
{% if previous %}
Previous release: [{{ previous }}]
{% endif %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^build", group = "Changed" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^chore", group = "Maintenance" },
    { body = "BREAKING CHANGE", group = "Breaking" },
]
