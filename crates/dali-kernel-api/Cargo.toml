[package]
name = "dali-kernel-api"
version = "0.1.0-alpha.4"
edition = "2024"
publish = true
description = "Public hardware-neutral API for Dali OS kernel integrations"
license = "MIT OR Apache-2.0"

[features]
storage-write = []
abi-context-switch = []
driver-hardware-test = []
usb-cdc = ["dep:usb-device"]
usb-install = ["usb-cdc"]

[dependencies]
dali-driver-api = { path = "../dali-driver-api" }
dali-targets = { path = "../dali-targets" }
dali-usb = { path = "../dali-usb" }
usb-device = { version = "=0.3.2", optional = true, default-features = false }

[lints]
workspace = true
