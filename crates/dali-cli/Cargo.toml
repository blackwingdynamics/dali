[package]
name = "dali-cli"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
dali-amrn = { path = "../dali-amrn" }
dali-crypto = { path = "../dali-crypto" }
dali-device = { path = "../dali-device" }
dali-metadata = { path = "../dali-metadata" }
dali-targets = { path = "../dali-targets" }
getrandom = "=0.3.4"
object = { version = "0.40", default-features = false, features = ["read", "elf"] }
sha2 = { version = "0.11.0", default-features = false }

[[bin]]
name = "dali"
path = "src/main.rs"
