name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

  documentation:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Markdown documentation
        run: python3 scripts/check-docs.py

  host:
    name: Host workspace checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check host workspace
        run: cargo check --workspace --exclude dali-kernel

      - name: Run host tests
        run: cargo test --workspace --exclude dali-kernel

      - name: Run host Clippy
        run: cargo clippy --workspace --all-targets --exclude dali-kernel -- -D warnings

  embedded:
    name: ${{ matrix.profile }} embedded checks (${{ matrix.contract }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: f405
            contract: legacy
            features: board-stm32f405-sd,usb-cdc
          - profile: f405
            contract: isolation
            features: board-stm32f405-sd,usb-cdc,abi-current,abi-mpu,abi-relocation
          - profile: f405
            contract: production
            features: board-stm32f405-sd,usb-cdc,abi-context-switch,abi-relocation,abi-authentication,repository-loader,storage-write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust and embedded target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Check kernel
        run: cargo check -p dali-kernel --no-default-features --features ${{ matrix.features }} --target thumbv7em-none-eabihf

      - name: Run kernel Clippy
        run: cargo clippy -p dali-kernel --no-default-features --features ${{ matrix.features }} --target thumbv7em-none-eabihf --bin dali-kernel -- -D warnings

      - name: Build kernel
        if: matrix.contract != 'production'
        run: cargo build -p dali-kernel --no-default-features --features ${{ matrix.features }} --target thumbv7em-none-eabihf

      - name: Build production kernel
        if: matrix.contract == 'production'
        run: cargo build -p dali-kernel --release --no-default-features --features ${{ matrix.features }} --target thumbv7em-none-eabihf

      - name: Install LLVM tools
        if: matrix.contract == 'production'
        run: rustup component add llvm-tools-preview

      - name: Generate production memory report
        if: matrix.contract == 'production'
        env:
          DALI_REPORT_DIR: ${{ runner.temp }}/dali-f405-memory-report
        run: scripts/report-f405-memory.sh

      - name: Upload production memory report
        if: matrix.contract == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: f405-production-memory-report
          path: ${{ runner.temp }}/dali-f405-memory-report
          if-no-files-found: error

  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff-tree --check -r --no-commit-id HEAD
