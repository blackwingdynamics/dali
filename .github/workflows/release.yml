name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"

permissions:
  contents: write

jobs:
  validate:
    name: Validate production release inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust and embedded target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Install host system dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libudev-dev pkg-config

      - name: Install LLVM tools
        run: rustup component add llvm-tools-preview

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check host workspace
        run: cargo check --workspace --exclude dali-kernel --exclude dali-firmware

      - name: Run host tests
        run: cargo test --workspace --exclude dali-kernel

      - name: Run host Clippy
        run: cargo clippy --workspace --all-targets --exclude dali-kernel --exclude dali-firmware -- -D warnings

      - name: Check production kernel
        run: cargo check -p dali-firmware --bin dali-f405 --no-default-features --features stm32f405,usb-cdc,abi-context-switch,abi-relocation,abi-authentication,repository-loader,storage-write --target thumbv7em-none-eabihf

      - name: Run production kernel Clippy
        run: cargo clippy -p dali-firmware --no-default-features --features stm32f405,usb-cdc,abi-context-switch,abi-relocation,abi-authentication,repository-loader,storage-write --target thumbv7em-none-eabihf --bin dali-f405 -- -D warnings

      - name: Build production kernel
        run: cargo build -p dali-firmware --release --bin dali-f405 --no-default-features --features stm32f405,usb-cdc,abi-context-switch,abi-relocation,abi-authentication,repository-loader,storage-write --target thumbv7em-none-eabihf

      - name: Generate production memory report
        env:
          DALI_REPORT_DIR: ${{ runner.temp }}/dali-f405-memory-report
        run: scripts/report-f405-memory.sh

      - name: Upload production memory report
        uses: actions/upload-artifact@v4
        with:
          name: f405-production-memory-report-release-${{ github.run_id }}
          path: ${{ runner.temp }}/dali-f405-memory-report
          if-no-files-found: error

  release:
    name: Generate changelog and release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        run: cargo install git-cliff --version 2.13.0 --locked

      - name: Generate archived changelog
        run: sh scripts/archive-changelog.sh "${GITHUB_REF_NAME}"

      - name: Commit changelog archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/changelog
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
          else
            git commit -m "docs(changelog): archive ${GITHUB_REF_NAME} [skip ci]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=""
          case "${GITHUB_REF_NAME}" in
            *-alpha.*|*-beta.*|*-rc.*)
              prerelease_flag="--prerelease"
              ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "Dali OS ${GITHUB_REF_NAME}" \
            --notes-file "docs/changelog/${GITHUB_REF_NAME}.md" \
            ${prerelease_flag}
